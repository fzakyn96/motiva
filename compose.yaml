services:

  # ============================================================
  # Laravel Application
  # ============================================================

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: motiva-app

    restart: unless-stopped

    working_dir: /app

    ports:
      - "8080:80"

    volumes:
      - .:/app

    environment:
      SERVER_NAME: ":80"

    depends_on:
      sqlserver:
        condition: service_healthy

      redis:
        condition: service_healthy


  # ============================================================
  # Laravel Queue Worker
  # ============================================================

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: motiva-worker

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app

    command:
      [
        "php",
        "artisan",
        "queue:work",
        "redis",
        "--sleep=1",
        "--tries=3",
        "--timeout=90"
      ]

    depends_on:
      sqlserver:
        condition: service_healthy

      redis:
        condition: service_healthy


  # ============================================================
  # Laravel Scheduler
  # ============================================================

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: motiva-scheduler

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app

    command:
      [
        "sh",
        "-c",
        "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
      ]

    depends_on:
      sqlserver:
        condition: service_healthy

      redis:
        condition: service_healthy


  # ============================================================
  # SQL Server 2022
  # ============================================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: motiva-sqlserver

    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MotivaDev_2026!' -C -Q 'SELECT 1' || exit 1"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ============================================================
  # Redis
  # ============================================================

  redis:
    image: redis:7-alpine

    container_name: motiva-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 3s
      retries: 10


  # ============================================================
  # Mailpit
  # ============================================================

  mailpit:
    image: axllent/mailpit:latest

    container_name: motiva-mailpit

    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"


# ==============================================================
# Persistent Volumes
# ==============================================================

volumes:

  sqlserver-data:

  redis-data:
